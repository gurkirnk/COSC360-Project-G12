services:
  mongodb:
    image: mongo:7
    container_name: cosc360_mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosc360_backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-3000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}:${FRONTEND_PORT:-5173}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb}:${MONGODB_PORT:-27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-app_db}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      - mongodb
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cosc360_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - backend

volumes:
  mongo_data:
